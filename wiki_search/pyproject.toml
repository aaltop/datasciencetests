[project]
name = "wiki-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.140.13",
  "pydantic>=2.13.4",
  "requests",
  "sentence-transformers>=5.6.1",
  "transformers>=5.14.1",
]

[project.optional-dependencies]
cuda = ["torch"]
rocm = ["torch==2.12.0"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
  { index = "torch-rocm", extra = "rocm" },
  { index = "torch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "torch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu132"

[dependency-groups]
dev = [
    "pyinstrument>=5.1.3",
]
