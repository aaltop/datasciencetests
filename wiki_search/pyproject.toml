[project]
name = "wiki-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.140.13",
  "idna==3.18",
  "mcp==2.0.0",
  "pydantic>=2.13.4",
  "requests",
  "sentence-transformers>=5.6.1",
  "transformers>=5.14.1",
]

[project.optional-dependencies]
cuda = ["torch"]
rocm = ["torch==2.12.0"]

[dependency-groups]
dev = [
  "pyinstrument>=5.1.3",
]

[tool.ruff.lint.flake8-comprehensions]
# dict() calls I find easier to write, not having to write the
# quotations, and they look neater without all that extra stuff
# too.
allow-dict-calls-with-keyword-arguments = true

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
idna = { index = "pypi" }
torch = [
  { index = "torch-rocm", extra = "rocm" },
  { index = "torch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "torch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu132"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
